server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index conf.html;

    location = /api/books {
        proxy_pass http://books:5000/books;
        proxy_set_header Host $host;
    }
    location = /api/members {
        proxy_pass http://members:5000/members;
        proxy_set_header Host $host;
    }
    location = /api/loans {
        proxy_pass http://loans:5000/loans;
        proxy_set_header Host $host;
    }
    location = /api/loans/create {
        proxy_pass http://loans:5000/loans;
        proxy_set_header Host $host;
    }
    location = /api/health/books {
        proxy_pass http://books:5000/health;
    }
    location = /api/health/members {
        proxy_pass http://members:5000/health;
    }
    location = /api/health/loans {
        proxy_pass http://loans:5000/health;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
